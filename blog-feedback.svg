<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="t3">
  <title id="t3">Обратная связь по макету с заметками и комментариями</title>
  <rect width="800" height="500" rx="24" fill="#F5F7FA"/>
  <rect x="90" y="80" width="470" height="320" rx="18" fill="white" stroke="#D5E0F5" stroke-width="2"/>
  <circle cx="120" cy="110" r="7" fill="#FF6B6B"/>
  <circle cx="146" cy="110" r="7" fill="#FFD166"/>
  <circle cx="172" cy="110" r="7" fill="#6BCB77"/>
  <rect x="120" y="140" width="410" height="36" rx="10" fill="#E8F0FE"/>
  <rect x="120" y="192" width="240" height="30" rx="8" fill="#D5E0F5"/>
  <rect x="120" y="238" width="300" height="22" rx="8" fill="#E8F0FE"/>
  <rect x="120" y="272" width="340" height="22" rx="8" fill="#E8F0FE"/>
  <rect x="120" y="316" width="180" height="46" rx="23" fill="#4C78A9"/>

  <g transform="rotate(6 660 150)">
    <rect x="580" y="90" width="180" height="120" rx="14" fill="#FFF3D6" stroke="#FFD166" stroke-width="2"/>
    <text x="670" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A3A5C">Заголовок длиннее</text>
    <text x="670" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1A3A5C">и цепляет сильнее</text>
  </g>

  <g transform="rotate(-5 660 300)">
    <rect x="580" y="250" width="190" height="110" rx="14" fill="#E0F0FF" stroke="#4C78A9" stroke-width="2"/>
    <text x="675" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A3A5C">Кнопка CTA</text>
    <text x="675" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1A3A5C">крупнее и на первом экране</text>
  </g>

  <g transform="rotate(3 660 420)">
    <rect x="590" y="380" width="170" height="80" rx="14" fill="#F0E0FF" stroke="#A78BFA" stroke-width="2"/>
    <text x="675" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A3A5C">Убрать блок</text>
    <text x="675" y="436" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1A3A5C">или перенести ниже</text>
  </g>

  <path d="M590 210 q30 -18 60 -6" stroke="#FF6B6B" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="2 8"/>
  <path d="M590 360 q30 -18 60 -8" stroke="#FF6B6B" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="2 8"/>
</svg>
